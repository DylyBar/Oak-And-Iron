<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Oak & Iron</title>

    <!-- ==================================================================
         STYLES
         ================================================================== -->
    <style>
      /* ==========================================================================
       * 01. THEME VARIABLES
       * ========================================================================== */
      :root {
        --bg: #e8dcc0;
        --panel: #6b4e31;
        --edge: #2b1d14;
        --tx: #ffd54f;
        --w: #fff4dc;
        --slot: #4a3523;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #17120c;
        }
      }
      :root[data-theme="dark"] {
        --bg: #17120c;
      }
      /* ==========================================================================
       * 02. PAGE BASE
       * ========================================================================== */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        box-sizing: border-box;
      }
      body {
        height: 100dvh;
        background: var(--bg);
        font-family: "Courier New", monospace;
        color: var(--w);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 8px;
      }
      /* ==========================================================================
       * 03. LAYOUT
       * The page never scrolls: the canvas is sized by fitCanvas() to the space
       * left over after the chat log, and #left shrinks to the canvas width.
       * ========================================================================== */
      #wrap {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        width: 100%;
        align-items: flex-start;
      }
      #left {
        flex: 0 0 auto;
        min-width: 0;
        position: relative;
      }
      /* ==========================================================================
       * 04. GAME CANVAS
       * ========================================================================== */
      #c {
        display: block;
        image-rendering: pixelated;
        border: 4px solid var(--edge);
        background: #102b43;
        touch-action: manipulation;
        filter: saturate(1.22) contrast(1.08);
      }
      /* ==========================================================================
       * 05. CHAT LOG
       * ========================================================================== */
      #chat {
        height: clamp(52px, 12vh, 80px);
        overflow-y: auto;
        background: #f3e6c4;
        color: #2b1d14;
        border: 3px solid var(--edge);
        border-top: 0;
        font-size: 13px;
        padding: 4px 6px;
        box-sizing: border-box;
      }
      /* ==========================================================================
       * 06. DIALOG BOX
       * ========================================================================== */
      #dlg {
        display: none;
        position: absolute;
        left: 6%;
        right: 6%;
        bottom: 60px;
        background: #f3e6c4;
        color: #2b1d14;
        border: 4px solid #6b4e31;
        outline: 2px solid var(--edge);
        padding: 10px;
        font-size: 15px;
        cursor: pointer;
      }
      /* ==========================================================================
       * 07. SIDE PANEL (bag / skills / gear / quests)
       * ========================================================================== */
      #side {
        display: none;
        position: fixed;
        right: 10px;
        bottom: 10px;
        width: 146px;
        max-height: 80vh;
        overflow: auto;
        z-index: 15;
        background: var(--panel);
        border: 3px solid var(--edge);
        padding: 4px;
        font-size: 11px;
        box-sizing: border-box;
      }
      #side.open {
        display: block;
      }
      /* ==========================================================================
       * 08. FLOATING BUTTONS
       * ========================================================================== */
      #bp,
      #sq_btn,
      #quest_btn,
      #map_btn,
      #set_btn,
      #ch_btn,
      #run_btn {
        position: absolute;
        bottom: calc(clamp(52px, 12vh, 80px) + 12px);
        font-size: 16px;
        line-height: 1;
        padding: 0;
        width: 30px;
        height: 30px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel);
        border: 2px solid var(--edge);
        cursor: pointer;
        z-index: 10;
      }
      #bp {
        right: 8px;
      }
      #sq_btn {
        right: 44px;
      }
      #quest_btn {
        right: 80px;
      }
      #map_btn {
        right: 116px;
      }
      #set_btn {
        right: 152px;
      }
      #ch_btn {
        right: 188px;
      }
      #run_btn {
        right: 224px;
      }
      #side.utility {
        width: min(300px, calc(100vw - 20px));
      }
      #side.utility #tabs,
      #side.utility #inv,
      #side.utility #gr {
        display: none !important;
      }
      #skillsPanel,
      #questsPanel {
        display: none;
      }
      #side.utility #skillsPanel,
      #side.utility #questsPanel {
        display: block;
      }
      #side.utility #sk,
      #side.utility #qu {
        display: block;
      }
      #side.utility.skills-view #questsPanel,
      #side.utility.quests-view #skillsPanel {
        display: none;
      }
      #skillsPanel h3,
      #questsPanel h3 {
        margin: 4px 0;
        color: #ffd54f;
        font-size: 12px;
      }
      /* ==========================================================================
       * 09. MINIMAP
       * ========================================================================== */
      #mw {
        position: absolute;
        top: 30px;
        right: 6px;
        width: 240px;
        height: auto;
        display: none;
        z-index: 11;
        padding: 4px;
        box-sizing: border-box;
        background: rgba(30, 20, 10, 0.92);
        border: 2px solid var(--edge);
      }
      #mm {
        display: block;
        width: 228px;
        height: 152px;
        image-rendering: pixelated;
      }
      #mapViewport {
        position: relative;
        width: 228px;
        height: 152px;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      #mapViewport.dragging {
        cursor: grabbing;
      }
      #mapLayer {
        position: absolute;
        inset: 0;
        width: 228px;
        height: 152px;
        transform-origin: 0 0;
      }
      #enemyMarkers {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #enemyMarkers .enemy-map-hit {
        position: absolute;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        background: transparent;
        color: transparent;
        pointer-events: auto;
        cursor: help;
      }
      #enemyMarkers .enemy-map-hit:hover,
      #enemyMarkers .enemy-map-hit:focus-visible {
        outline: 1px solid #fff;
        outline-offset: -2px;
      }
      #mineMarkers {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #mineMarkers .mine-map-marker {
        position: absolute;
        width: 15px;
        height: 15px;
        padding: 0;
        border: 1px solid #f5d894;
        border-radius: 50%;
        background: #493927;
        color: #ffe6a1;
        font: bold 11px/13px monospace;
        text-align: center;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        cursor: help;
      }
      #mapZoom {
        position: absolute;
        z-index: 2;
        top: 4px;
        right: 4px;
        display: flex;
        gap: 3px;
      }
      #mapZoom button {
        width: 22px;
        height: 22px;
        padding: 0;
        font: bold 16px monospace;
        line-height: 16px;
        background: rgba(30, 20, 10, 0.9);
      }
      #mapZoomLevel {
        min-width: 32px;
        padding: 4px 2px;
        text-align: center;
        font-size: 9px;
        background: rgba(30, 20, 10, 0.9);
      }
      .quest-track {
        cursor: pointer;
      }
      .quest-track:hover,
      .quest-track.tracked {
        outline: 1px solid #ffd54f;
        background: rgba(255, 213, 79, 0.12);
      }
      #smithing .box {
        width: min(390px, 92vw);
        max-height: 82vh;
        overflow: auto;
      }
      #smithing .recipe {
        display: block;
        width: 100%;
        margin: 5px 0;
        text-align: left;
      }
      #smithing .recipe small {
        display: block;
        opacity: 0.8;
      }
      #pd {
        position: absolute;
        left: 0;
        top: 0;
        width: 7px;
        height: 7px;
        background: #f00;
        border: 1px solid #fff;
        border-radius: 50%;
        pointer-events: none;
      }
      #qd {
        position: absolute;
        left: 0;
        top: 0;
        width: 7px;
        height: 7px;
        background: #ffd54f;
        border: 1px solid #251b0c;
        transform: rotate(45deg);
        pointer-events: none;
        display: none;
      }
      /* ==========================================================================
       * 10. SIDE PANEL TABS
       * ========================================================================== */
      #tabs {
        display: flex;
        gap: 3px;
        margin-bottom: 6px;
      }
      button {
        background: var(--slot);
        color: var(--w);
        border: 2px solid var(--edge);
        font: inherit;
        padding: 4px 6px;
        cursor: pointer;
      }
      #tabs button {
        flex: 1;
        padding: 4px 0;
        font-size: 12px;
      }
      #tabs button.on {
        background: #9a7a4e;
      }
      /* ==========================================================================
       * 11. INVENTORY GRID
       * ========================================================================== */
      #inv {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 3px;
      }
      .s {
        aspect-ratio: 1;
        background: var(--slot);
        border: 1px solid var(--edge);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        position: relative;
        user-select: none;
        cursor: grab;
      }
      .s[draggable="true"]:active {
        cursor: grabbing;
        opacity: 0.65;
      }
      .s.drag-over {
        outline: 2px solid #ffd54f;
        outline-offset: -2px;
      }
      .s i {
        position: absolute;
        top: 0;
        left: 2px;
        font: 9px monospace;
        color: #ff0;
        font-style: normal;
      }
      #sk,
      #gr,
      #qu {
        display: none;
      }
      .ic {
        width: 20px;
        height: 20px;
        image-rendering: pixelated;
        vertical-align: middle;
      }
      .s .ic {
        width: 20px;
        height: 20px;
      }
      #side button {
        padding: 2px 4px;
        font-size: 11px;
      }
      /* ==========================================================================
       * 12. INFO ROWS
       * ========================================================================== */
      .k {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--slot);
        border: 1px solid var(--edge);
        margin-bottom: 3px;
        padding: 2px 5px;
        font-size: 11px;
      }
      .k b {
        color: var(--tx);
      }
      #cb {
        width: 100%;
        margin-top: 6px;
      }
      /* ==========================================================================
       * 13. CONTEXT MENU
       * ========================================================================== */
      #m {
        position: fixed;
        display: none;
        background: #7a5c3a;
        border: 2px solid var(--edge);
        z-index: 30;
        font-size: 13px;
        min-width: 140px;
      }
      #m div {
        padding: 3px 8px;
        cursor: pointer;
      }
      #m div:hover {
        background: #9a7a4e;
      }
      #m div:first-child {
        background: #222;
        color: var(--tx);
        cursor: default;
      }
      /* ==========================================================================
       * 14. MODALS
       * ========================================================================== */
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      .box {
        background: var(--panel);
        border: 4px solid var(--edge);
        padding: 14px;
        width: min(340px, 90vw);
        max-height: 90vh;
        overflow: auto;
        text-align: center;
      }
      .box h2,
      .box h3 {
        margin: 4px 0;
      }
      .box input {
        font: inherit;
        padding: 4px;
        width: 80%;
        text-align: center;
      }
      /* ==========================================================================
       * 15. FORM ROWS
       * ========================================================================== */
      .row {
        display: flex;
        gap: 4px;
        justify-content: center;
        align-items: center;
        margin: 5px 0;
      }
      .sw {
        width: 24px;
        height: 24px;
        border: 2px solid var(--edge);
        padding: 0;
      }
      .sw.on {
        outline: 3px solid var(--tx);
      }
      /* ==========================================================================
       * 16. TITLE / PLAY SCREEN
       * Front screen shown at boot: game name, music, settings and Play.
       * ========================================================================== */
      #title {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: radial-gradient(circle at 50% 18%, rgba(23, 18, 12, 0.55), rgba(10, 8, 5, 0.94) 72%);
      }
      .titleInner {
        position: relative;
        width: min(460px, 92vw);
        max-height: 100%;
        overflow: auto;
        padding: 24px 22px 18px;
        text-align: center;
        background: rgba(43, 29, 20, 0.94);
        border: 4px solid var(--edge);
        outline: 2px solid #8a6a44;
        box-shadow:
          0 10px 0 rgba(0, 0, 0, 0.35),
          0 0 0 1px #000 inset;
      }
      .titleBadge {
        font-size: 34px;
        line-height: 1;
        filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.5));
      }
      .gameTitle {
        margin: 4px 0 4px;
        font-size: clamp(34px, 8vw, 52px);
        line-height: 1.05;
        letter-spacing: 3px;
        color: var(--tx);
        text-shadow:
          0 4px 0 #7a3f16,
          0 8px 18px rgba(0, 0, 0, 0.6);
      }
      .titleSub {
        margin: 0 0 16px;
        font-size: 13px;
        color: #d8c39b;
        letter-spacing: 1px;
      }
      .titleMenu {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 6px;
      }
      .titleMenu .trow {
        display: flex;
        gap: 8px;
      }
      .titleMenu .trow > button {
        flex: 1;
        font-size: 13px;
        padding: 8px 4px;
      }
      #title button {
        letter-spacing: 1px;
      }
      #title button:hover {
        background: #b08d5c;
      }
      #title button:active {
        transform: translateY(1px);
      }
      #t_play {
        font-size: 20px;
        padding: 12px;
        letter-spacing: 2px;
        background: #9a7a4e;
      }
      .titleNow {
        margin: 14px 0 0;
        min-height: 15px;
        font-size: 12px;
        color: #e8d5a8;
      }
      .titleNote {
        margin: 10px 0 0;
        font-size: 11px;
        line-height: 1.5;
        color: #bfa87e;
      }
      .titleNote span {
        color: #8d7a5b;
      }
      /* Compact title card on short windows so it still fits without scrolling */
      @media (max-height: 520px) {
        .titleInner {
          padding: 14px 16px 10px;
        }
        .titleBadge {
          font-size: 22px;
        }
        .gameTitle {
          margin: 2px 0;
          font-size: clamp(26px, 9vh, 40px);
        }
        .titleSub {
          margin-bottom: 10px;
        }
        .titleNow {
          margin-top: 8px;
        }
        .titleNote {
          display: none;
        }
        #t_play {
          padding: 9px;
          font-size: 17px;
        }
        .titleMenu .trow > button {
          padding: 6px 4px;
        }
      }
      /* Settings must open above the title screen */
      #settings_modal {
        z-index: 50;
      }
      /* Death/respawn screen */
      #death {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.85);
      }
      #death .box {
        background: var(--panel);
        border: 4px solid var(--edge);
        padding: 24px;
        text-align: center;
        width: min(360px, 92vw);
        max-height: 80vh;
        overflow: auto;
      }
      #death .box h2 {
        margin: 8px 0 16px;
        font-size: 24px;
        color: #ff5f57;
      }
      #death .cause {
        margin: 12px 0;
        font-size: 13px;
        color: #d8c39b;
      }
      #death .items {
        margin: 16px 0;
        min-height: 36px;
        font-size: 12px;
        color: #a0a0a0;
      }
      #death .items span {
        color: #ffd54f;
        font-weight: bold;
        cursor: pointer;
        text-decoration: underline;
      }
      #death .items span:hover {
        color: #fff;
      }
      #respawn {
        margin-top: 24px;
        padding: 10px 24px;
        font-size: 14px;
        background: #9a7a4e;
        color: #111;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      #respawn:hover {
        background: #b08d5c;
      }
      #respawn:active {
        transform: translateY(1px);
      }
      #graveMarker {
        position: absolute;
        z-index: 3;
        display: none;
        width: 14px;
        height: 14px;
        color: #fff1bd;
        background: #713e35;
        border: 1px solid #fff1bd;
        border-radius: 3px;
        font: bold 12px/13px monospace;
        text-align: center;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <!-- Game layout: canvas, chat log, floating buttons and side panel -->
    <div id="wrap">
      <div id="left">
        <canvas id="c"></canvas>
        <div id="dlg"></div>
        <div id="mw">
          <div id="mapViewport">
            <div id="mapLayer">
              <canvas id="mm" width="684" height="456"></canvas>
              <div id="enemyMarkers"></div>
              <div id="mineMarkers" aria-label="Mine entrances"></div>
              <div id="graveMarker" title="Your gravestone — recover your items here" aria-label="Your gravestone">†</div>
              <div id="pd"></div>
              <div id="qd"></div>
            </div>
            <div id="mapZoom">
              <button id="mapZoomOut" title="Zoom out" aria-label="Zoom out">−</button>
              <span id="mapZoomLevel">100%</span>
              <button id="mapZoomIn" title="Zoom in" aria-label="Zoom in">+</button>
            </div>
          </div>
        </div>
        <button id="set_btn" title="Settings">⚙️</button>
        <button id="ch_btn" title="Character">🧍</button>
        <button id="run_btn" title="Toggle run">🏃</button>
        <button id="map_btn" title="Toggle Map">🗺️</button>
        <button id="sq_btn" title="Skills" aria-label="Skills">
          <svg width="19" height="19" viewBox="0 0 20 20" shape-rendering="crispEdges" aria-hidden="true">
            <path d="M2 17 7 3h3l5 14h-3l-1-4H6l-1 4z" fill="#d5d9de" stroke="#382719" stroke-width="2"/>
            <path d="M7 10h4M15 5h3v3h-3z" fill="none" stroke="#b87333" stroke-width="2"/>
          </svg>
        </button>
        <button id="quest_btn" title="Quests" aria-label="Quests">
          <svg width="19" height="19" viewBox="0 0 20 20" shape-rendering="crispEdges" aria-hidden="true">
            <path d="M3 2h11l3 3v13H3z" fill="#ead7a6" stroke="#382719" stroke-width="2"/>
            <path d="M14 2v4h4M6 8h8M6 11h8M6 14h6" fill="none" stroke="#765332" stroke-width="2"/>
            <path d="m2 5 2 2 3-4" fill="none" stroke="#4d963d" stroke-width="2"/>
          </svg>
        </button>
        <button id="bp" title="Inventory">🎒</button>
        <div id="chat"></div>
      </div>
      <div id="side">
        <button id="cx" style="width:100%;margin-bottom:8px">Close</button>
        <div id="tabs">
          <button id="t1" class="on">Bag</button>
        <button id="t3">Gear</button>
        </div>
        <div id="inv"></div>
        <div id="gr"></div>
        <section id="skillsPanel"><h3>Skills</h3><div id="sk"></div></section>
        <section id="questsPanel"><h3>Quests</h3><div id="qu"></div></section>
        <div class="row">
        <button id="sv">Save</button>
        <button id="zi">+</button>
        <button id="zo">-</button>
        </div>
      </div>
    </div>
    <!-- Title / play screen (no account needed) -->
    <div id="title">
      <div class="titleInner">
        <div class="titleBadge">⚔️</div>
        <h1 class="gameTitle">Oak &amp; Iron</h1>
        <p class="titleSub">A pocket-sized island adventure</p>
        <div class="titleMenu">
          <button id="t_play">Play</button>
          <button id="t_new" style="display:none">New Game</button>
          <div class="trow">
            <button id="t_settings">⚙️ Settings</button>
            <button id="t_music">🎵 Music: ON</button>
          </div>
        </div>
        <p id="t_now" class="titleNow"></p>
        <p class="titleNote">No account needed — just play.<br><span>Click to enable sound</span></p>
      </div>
    </div>

    <!-- Context menu and modal windows -->
    <div id="m"></div>
    <div id="cc" class="ov"></div>
    <div id="shop" class="ov"></div>
    <div id="smithing" class="ov"></div>
    <div id="char_modal" class="ov">
      <div class="box">
        <h2>Character</h2>
        <div id="chbody"></div>
        <button id="cls_ch" style="margin-top:8px">Close</button>
      </div>
    </div>
    <div id="settings_modal" class="ov">
      <div class="box">
        <h2>Settings</h2>
        <div id="setx"></div>
        <div class="row">
          <button id="snd_btn">Sound: ON</button>
        </div>
        <div class="row">
          <button id="sv_btn_st">Save Game</button>
        </div>
        <button id="cls_set">Close</button>
      </div>
    </div>

    <!-- Death / respawn screen -->
    <div id="death" class="ov">
      <div class="box">
        <h2>You Died</h2>
        <div class="cause" id="deathCause"></div>
        <div class="items" id="deathItems"></div>
        <button id="respawn">Respawn</button>
      </div>
    </div>

    <!-- ==================================================================
         GAME SCRIPT
         All game code lives in the single window.onload handler below and
         is split into numbered sections (see the table of contents).
         ================================================================== -->
    <script>
      /* ==========================================================================
       * OAK & IRON - main game script
       *
       * Everything runs inside the single window.onload handler below. The code
       * is grouped into numbered sections; this is the quick map:
       *
       *   Audio ................... 01-03, 24, 50
       *   World & terrain ......... 04-12

        /* ==========================================================================

        const hs = (x, y) => {

            v = b * b * (3 - 2 * b);

                } else if (K == "xbow") {

            },
          ]);
          ents.sort((a, b) => a[0] - b[0]).forEach((e) => e[1]());
          for (let i = fx.length - 1; i >= 0; i--) {
            const f = fx[i];
            if (f.e < now) {
              fx.splice(i, 1);
              continue;
            }
            if (now < f.s) continue;
            const p = (now - f.s) / (f.e - f.s),
              X = f.x * T + 12,
              Y = f.y * T + 12;
            g.globalAlpha = 1 - p;
            if (f.t == "slash") {
              g.strokeStyle = f.c;
              g.lineWidth = 3;
              g.beginPath();
              g.arc(X, Y, 11, -1.2 + p * 2.4, -0.2 + p * 2.4);
              g.stroke();
            } else if (f.t == "burst") {
              for (let k = 0; k < 8; k++) {
                const a = k * 0.785 + f.r,
                  d = 4 + p * 14,
                  z = 4 * (1 - p) + 1;
                F(f.c, X + Math.cos(a) * d - 2, Y + Math.sin(a) * d - 2, z, z);
              }
            } else if (f.t == "ring") {
              g.strokeStyle = f.c;
              g.lineWidth = 3;
              g.beginPath();
              g.arc(X, Y, 4 + p * f.rad, 0, 6.3);
              g.stroke();
            } else {
              g.strokeStyle = f.c;
              g.lineWidth = 2;
              g.beginPath();
              g.ellipse(X, Y + 8, 12, 5, 0, 0, 6.3);
              g.stroke();
              for (let k = 0; k < 4; k++) {
                const a = p * 6 + k * 1.57;
                F(f.c, X + Math.cos(a) * 12 - 1, Y + 8 + Math.sin(a) * 5 - p * 20, 3, 3);
              }
            }
            g.globalAlpha = 1;
          }
          for (let i = proj.length - 1; i >= 0; i--) {
            const q = proj[i],
              f = 1 - (q.e - now) / 350;
            if (f > 1) {
              proj.splice(i, 1);
              continue;
            }
            const X = (q.a + (q.c - q.a) * f) * T + 12,
              Y = (q.b + (q.d - q.b) * f) * T + 12;
            const tc = q.sk
              ? { Warrior: "#ffb040", Ranger: "#9f9", Mage: "#6cf" }[q.sk]
              : q.k == "bow"
                ? "#e8e0c0"

            for (let k = 1; k < 5; k++) {
              const ff = Math.max(0, f - k * 0.05);
              g.globalAlpha = 0.5 / k;
              F(tc, (q.a + (q.c - q.a) * ff) * T + 10, (q.b + (q.d - q.b) * ff) * T + 10, 5, 5);
            }
            g.globalAlpha = 1;
            if (q.sk) {
              if (q.sk == "Warrior") {
                if (q.si == 0)
                  F("#ccc", X - 8, Y - 4, 16, 8); // Bash
                else if (q.si == 1) {
                  g.fillStyle = "#f22";
                  g.beginPath();
                  g.arc(X, Y, 12, 0, Math.PI);

                } // Cleave
                else {
                  F("#fa0", X - 10, Y - 10, 20, 20);

              } else if (q.sk == "Ranger") {
                if (q.si == 0) F("#0f0", X - 3, Y - 3, 6, 6);
                else if (q.si == 1) {
                  F("#ff0", X - 8, Y - 8, 16, 16);
                  F("#fff", X - 4, Y - 4, 8, 8);
                } else {
                  F("#888", X - 6, Y - 20 + f * 30, 4, 12);
                  F("#888", X + 2, Y - 10 + f * 30, 4, 12);
                }
              } else if (q.sk == "Mage") {
                if (q.si == 0) F("#0cf", X - 8, Y - 8, 16, 16);
                else if (q.si == 1) {
                  g.fillStyle = "#f40";
                  g.beginPath();
                  g.arc(X, Y, 8 + f * 8, 0, 6.3);
                  g.fill();
                } else {
                  g.strokeStyle = "#c07bff";
                  g.lineWidth = 4;
                  g.beginPath();
                  g.arc(X, Y, 4 + f * 16, 0, 6.3);
                  g.stroke();
                }
              }
            } else {
              g.fillStyle = q.k == "bow" ? "#e8e0c0" : q.col || "#c07bff";
              g.fillRect(X - 3, Y - 3, q.k == "bow" ? 6 : 5, q.k == "bow" ? 2 : 5);
            }
          }
          g.font = "bold 11px monospace";
          g.textAlign = "center";
          for (let i = splats.length - 1; i >= 0; i--) {
            const s = splats[i];
            if (s.e < now) {
              splats.splice(i, 1);
              continue;
            }
            const x = s.x * T + 12,

            if (!CFG.splat) continue;

          for (let i = fl.length - 1; i >= 0; i--) {

          const ph = (now / 1000 / 240 + 0.05) % 1,

          if (inMine) {

            g.setTransform(caveS, 0, 0, caveS, 0, 0);

            const caveLight = g.createRadialGradient(screenX / caveS, screenY / caveS, 30, screenX / caveS, screenY / caveS, 250);
            caveLight.addColorStop(0, "rgba(228,190,124,.12)");

          }
          g.setTransform(S, 0, 0, S, 0, 0);
          if (dk > 0) F("rgba(15,25,70," + (dk * 0.5).toFixed(2) + ")", 0, 0, LW, LH);
          if (CFG.gfx) {
            const vg = g.createRadialGradient(LW / 2, LH / 2, LH * 0.4, LW / 2, LH / 2, LH * 0.95);
            vg.addColorStop(0, "rgba(0,0,0,0)");

            if (dk > 0.15)
              for (let i = 0; i < 16; i++) {
                const a = 0.4 + 0.6 * Math.sin(now / 400 + i * 2),

          if (hov.x >= 0) {

            }
            g.strokeStyle = "rgba(255,255,255,.6)";
            g.lineWidth = 2;
            g.strokeRect(
              (hov.x * T - camx) * zoom + 0.5,
              (hov.y * T - camy) * zoom + 0.5,
              T * zoom - 1,
              T * zoom - 1,
            );
          }

          const tw = inMine ? { n: "Oak & Iron Mine" } : inT(P.x, P.y),
            hr = Math.floor((6 + ph * 24) % 24),
            mh = maxHp();
          g.textAlign = "left";
          g.font = "bold 12px monospace";
          g.fillStyle = "rgba(30,20,10,.75)";
          g.fillRect(6, 28, 175, 38);
          g.fillStyle = "#ffd54f";
          g.fillText(tw ? tw.n : "Wilderness", 12, 43);
          g.fillStyle = "#fff";
          g.fillText(hr + ":00", 12, 59);
          g.imageSmoothingEnabled = false;
          g.drawImage(SC.Coins, 54, 49, 13, 13);
          g.fillText(count("Coins") + "  CB " + cmb(), 72, 59);

          const cb_sk = ["Hitpoints", "Attack", "Ranged", "Magic", "Defence"].includes(P.lst_s)
            ? P.lst_s
            : CL[cls].s;
          const sk_sk = ["Woodcutting", "Mining", "Fishing", "Cooking", "Farming"].includes(P.lst_s)
            ? P.lst_s
            : "Woodcutting";
          const xp_pct = (s) => {
            const L = lv(s);
            return L == MAX_SKILL_LEVEL
              ? 1
              : Math.max(0, Math.min(1, (xp[s] - xpt[L]) / (xpt[L + 1] - xpt[L])));
          };
          F("rgba(30,20,10,.75)", 6, 74, 160, 20);

          F("rgba(30,20,10,.75)", 6, 98, 160, 20);

        /* ==========================================================================
         * 47. SAVE & LOAD

         * ========================================================================== */
        const SV = "pixelvale2";
        function save(m) {
          try {
            localStorage.setItem(
              SV,
              JSON.stringify({
                x: P.x,
                y: P.y,
                hp: P.hp,
                mp: P.mp,
                look,
                pname,
                xp,
                inv,
                gear,
                w: P.w,
                qs,
                trackedQuest,
                learnedSkills,
                cls,
                tickN,
                inMine,
                mineReturn,
                bank,
                pl: objs.filter((o) => o.type == "plot").map((o) => [o.st, o.g]),
                grave: grave,
              }),
            );
            if (m) msg("Game saved.", 1);
          } catch (e) {
            if (m) msg("Saving is not available here.");
          }
        }
        function load() {
          try {
            const s = JSON.parse(localStorage.getItem(SV));
            if (!s) return false;
            P.x = P.ox = s.x;
            P.y = P.oy = s.y;
            if (bl(P.x, P.y)) {
              P.x = P.ox = SPAWN.x;
              P.y = P.oy = SPAWN.y;
            }
            P.mp = s.mp || 10;
            P.w = s.w;
            inMine = !!s.inMine;
            mineReturn = s.mineReturn || null;
            Object.assign(look, s.look);
            pname = s.pname;
            Object.assign(xp, s.xp);
            const savedHp = Number(s.hp) || 0,
              previousMaxHp = lv("Hitpoints");
            P.hp = savedHp >= previousMaxHp ? maxHp() : Math.max(0, Math.min(maxHp(), savedHp));
            Object.assign(gear, s.gear);
            Object.assign(qs, s.qs);
            trackedQuest = s.trackedQuest ?? null;
            Object.keys(CL_SKILLS).forEach((className) => {
              if (Array.isArray(s.learnedSkills?.[className]))
                learnedSkills[className] = CL_SKILLS[className]
                  .slice(0, 3)
                  .map((_, index) => !!s.learnedSkills[className][index]);
            });
            s.inv.forEach((v, i) => (inv[i] = v));
            cls = s.cls;
            tickN = s.tickN;
            grave = s.grave;
            Object.assign(bank, s.bank || {});
            const pl = objs.filter((o) => o.type == "plot");
            (s.pl || []).forEach((v, i) => {
              if (pl[i]) {
                pl[i].st = v[0];
                pl[i].g = v[1];
              }
            });
            return true;
          } catch (e) {
            return false;
          }
        }
        /* ==========================================================================

        $("sv").onclick = () => save(1);

        cv.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            zoom = Math.min(2.6, Math.max(0.55, zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
          },
          { passive: false },
        );
        addEventListener("keydown", (e) => {
          if (!started) return;

            e.altKey ||

          }
        });

        /* ==========================================================================
         * 49. MINIMAP PLAYER MARKER
         * Keeps the red dot on the minimap in sync with the player.
         * ========================================================================== */
        const pd = $("pd");
        const qd = $("qd");
        const graveMarker = $("graveMarker");
        const mapLayer = $("mapLayer");
        const mapZoomLabel = $("mapZoomLevel");
        const mapViewport = $("mapViewport");
        let mapPanX = 0,
          mapPanY = 0,
          mapDrag = null;
        function clampMapPan() {
          mapPanX = Math.max(228 * (1 - mapZoom), Math.min(0, mapPanX));
          mapPanY = Math.max(152 * (1 - mapZoom), Math.min(0, mapPanY));
        }
        function setMapZoom(nextZoom, anchorX = 114, anchorY = 76) {
          const next = Math.min(4, Math.max(1, nextZoom)),
            ratio = next / mapZoom;
          mapPanX = anchorX - (anchorX - mapPanX) * ratio;
          mapPanY = anchorY - (anchorY - mapPanY) * ratio;
          mapZoom = next;
          clampMapPan();
          updateMapZoom();
        }
        function updateMapZoom() {
          const px = (P.x / W) * 228,
            py = (P.y / H) * 152;
          clampMapPan();
          mapLayer.style.transform = `translate(${mapPanX}px, ${mapPanY}px) scale(${mapZoom})`;
          mapZoomLabel.textContent = Math.round(mapZoom * 100) + "%";
          pd.style.left = px - 4 + "px";
          pd.style.top = py - 4 + "px";
          graveMarker.style.display = grave ? "block" : "none";
          if (grave) {

          if (target) {
            qd.style.left = (target.x / W) * 228 - 4 + "px";
            qd.style.top = (target.y / H) * 152 - 4 + "px";
          }
        }
        $("mapZoomIn").onclick = () => {
          setMapZoom(mapZoom * 1.25);
        };
        $("mapZoomOut").onclick = () => {
          setMapZoom(mapZoom / 1.25);
        };
        mapViewport.addEventListener("pointerdown", (e) => {
          if (e.button !== 0 || e.target.closest("#mapZoom, #enemyMarkers, #mineMarkers")) return;
          mapDrag = { id: e.pointerId, x: e.clientX, y: e.clientY };
          mapViewport.setPointerCapture(e.pointerId);
          mapViewport.classList.add("dragging");
          e.preventDefault();
        });
        mapViewport.addEventListener("pointermove", (e) => {
          if (!mapDrag || mapDrag.id !== e.pointerId) return;
          mapPanX += e.clientX - mapDrag.x;
          mapPanY += e.clientY - mapDrag.y;
          mapDrag.x = e.clientX;
          mapDrag.y = e.clientY;
          clampMapPan();
          updateMapZoom();
        });
        const endMapDrag = (e) => {
          if (!mapDrag || mapDrag.id !== e.pointerId) return;
          mapDrag = null;
          mapViewport.classList.remove("dragging");
        };
        mapViewport.addEventListener("pointerup", endMapDrag);
        mapViewport.addEventListener("pointercancel", endMapDrag);
        mapViewport.addEventListener("lostpointercapture", endMapDrag);
        $("mapViewport").addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const rect = mapViewport.getBoundingClientRect();

        /* ==========================================================================
         * 50. MUSIC SEQUENCER

        const TRK = [

              [5, 9, 12],
              [7, 11, 14],
              [0, 4, 7],
            ],
            w: "triangle",
            p: [0, 1, 2, 1, 0, 2, 1, 2],
          },
          {
            n: "Seaside Breeze",
            bpm: 96,
            r: 55,
            sc: [0, 2, 4, 5, 7, 9],
            ch: [
              [0, 4, 7],
              [9, 12, 16],
              [5, 9, 12],
              [7, 11, 14],
            ],
            w: "sine",
            p: [0, 2, 1, 2, 0, 1, 2, 1],
          },
          {
            n: "Goblin Hills",
            bpm: 108,
            r: 50,
            sc: [0, 2, 3, 5, 7, 8, 10],
            ch: [
              [0, 3, 7],
              [8, 12, 15],
              [5, 8, 12],
              [7, 10, 14],
            ],
            w: "square",
            p: [0, 2, 1, 2, 0, 2, 1, 2],
          },
          {
            n: "Night Vigil",
            bpm: 60,
            r: 52,
            sc: [0, 3, 5, 7, 10],
            ch: [
              [0, 7, 12],
              [3, 10, 15],
              [5, 12, 17],
              [0, 7, 12],
            ],
            w: "sine",
            p: [0, 1, 2, 1],
          },
        ];
        let ms = 0,
          mnext = 0;
        const mf = (m) => 440 * 2 ** ((m - 69) / 12);
        function mnote(fr, t, d, ty, v) {
          const o = actx.createOscillator(),
            gn = actx.createGain();
          o.type = ty;
          o.frequency.value = fr;
          o.connect(gn);
          gn.connect(MU);
          gn.gain.setValueAtTime(0, t);
          gn.gain.linearRampToValueAtTime(v, t + 0.03);
          gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
          o.start(t);
          o.stop(t + d + 0.05);
        }
        function mtick() {
          if (!actx || !MU || CFG.trk < 0) return;
          const K = TRK[CFG.trk],
            sd = 30 / K.bpm;
          if (mnext < actx.currentTime) mnext = actx.currentTime + 0.05;
          while (mnext < actx.currentTime + 0.5) {
            const c = K.ch[Math.floor(ms / 8) % K.ch.length],
              st = ms % 8;
            if (st == 0) mnote(mf(K.r - 12 + c[0]), mnext, sd * 7, "sine", 0.5);
            mnote(mf(K.r + c[K.p[st % K.p.length]]), mnext, sd * 1.6, K.w, 0.16);
            if (st % 4 == 2 && hs(ms, CFG.trk + 1) > 0.35)
              mnote(mf(K.r + 12 + K.sc[Math.floor(hs(ms * 3, 7) * K.sc.length)]), mnext, sd * 3, "sine", 0.22);
            mnext += sd;
            ms++;
          }
        }
        setInterval(mtick, 150);
        /* ==========================================================================
         * 51. SETTINGS PANEL
         * Toggle list, config persistence and the settings modal wiring.
         * ========================================================================== */
        const TG = [
          ["gfx", "Graphics", ["Low", "High"]],
          ["dn", "Day/night", ["Off", "On"]],
          ["run", "Run (R)", ["Walk", "Run"]],
          ["auto", "Auto-retaliate", ["Off", "On"]],
          ["names", "NPC names", ["Hide", "Show"]],
          ["splat", "Hit splats", ["Hide", "Show"]],
        ];
        function saveCfg() {
          try {
            localStorage.setItem("pixelvale_set", JSON.stringify(CFG));
          } catch (e) {}
        }
        /* ==========================================================================
         * 52. TITLE / PLAY SCREEN
         * Front screen controls: Play/Continue, New Game, Settings and Music.
         * ========================================================================== */
        const $title = $("title");
        const titleMusic = () => {
          const off = CFG.trk < 0 || !TRK[CFG.trk];
          $("t_music").textContent = "🎵 Music: " + (off ? "OFF" : "ON");
          $("t_now").textContent = off ? "Music off" : "♪ " + TRK[CFG.trk].n;
        };
        const showTitle = () => {
          $title.style.display = "flex";
          $("t_play").textContent = hasSave ? "Continue" : "Play";
          $("t_new").style.display = hasSave ? "" : "none";
          titleMusic();
        };
        const hideTitle = () => ($title.style.display = "none");
        const beginGame = () => {
          hideTitle();
          if (hasSave) {
            started = true;
            msg("Welcome back, " + pname + "! Game loaded.", 1);
          } else {
            buildCC();
            $("cc").style.display = "flex";
          }
        };
        $("t_play").onclick = beginGame;
        let tnc = 0;
        $("t_new").onclick = () => {
          if (!hasSave) return;
          if (!tnc++) {
            $("t_new").textContent = "Erase saved game?";
            setTimeout(() => {
              tnc = 0;
              $("t_new").textContent = "New Game";
            }, 3000);
            return;
          }
          try {
            localStorage.removeItem(SV);
          } catch (e) {}
          location.reload();
        };
        $("t_settings").onclick = () => {
          setUI();
          $("settings_modal").style.display = "flex";
        };
        $("t_music").onclick = () => {
          CFG.trk = CFG.trk < 0 ? 0 : -1;
          ms = 0;
          mnext = 0;
          saveCfg();
          setUI();
          titleMusic();
        };
        addEventListener("keydown", (e) => {
          if (e.target.tagName == "BUTTON") return;
          if ($title.style.display != "none" && (e.key == "Enter" || e.key == " ")) {
            e.preventDefault();
            beginGame();
          }
        });
        showTitle();
        /* ==========================================================================
         * 53. GAMEPLAY HELPERS
         * Run speed/energy drain and combat level calculation.
         * ========================================================================== */
        function spd() {
          if (CFG.run && P.en >= 1 && P.path.length) {
            P.en -= 2.2;
            return 2;
          }
          return 1;
        }
        function cmb() {
          const m = Math.max(lv("Attack"), Math.floor(lv("Ranged") * 1.5), Math.floor(lv("Magic") * 1.5));
          return Math.max(1, Math.floor(0.25 * (lv("Defence") + lv("Hitpoints")) + 0.325 * m));
        }
        function setUI() {
          $("setx").innerHTML =
            '<div class="row">🔊 <input id="vol" type="range" min="0" max="1" step=".05" value="' +
            CFG.vol +
            '" style="width:60%"></div><div class="row">🎵 <input id="mvol" type="range" min="0" max="1" step=".05" value="' +
            CFG.mvol +
            '" style="width:60%"></div><div class="row"><button data-m="-1">◀</button><span style="flex:1;font-size:13px">' +
            (CFG.trk < 0 ? "Music off" : TRK[CFG.trk].n) +
            '</span><button data-m="1">▶</button></div>' +
            TG.map(
              (t) =>
                `<div class="row"><button data-t="${t[0]}" style="width:100%">${t[1]}: ${t[2][CFG[t[0]]]}</button></div>`,
            ).join("");
        }
        $("setx").onclick = (e) => {
          const k = e.target.dataset.t,
            m = e.target.dataset.m;
          if (k) {
            CFG[k] ^= 1;
            saveCfg();
            setUI();
          }
          if (m) {
            const n = TRK.length + 1;
            CFG.trk = ((CFG.trk + 1 + +m + n) % n) - 1;
            ms = 0;
            mnext = 0;
            saveCfg();
            setUI();
            msg(CFG.trk < 0 ? "Music off." : "Now playing: " + TRK[CFG.trk].n);
          }
        };
        $("setx").oninput = (e) => {
          if (e.target.id == "mvol") {
            CFG.mvol = +e.target.value;
            if (MU) MU.gain.value = CFG.mvol * 0.5;
            saveCfg();
          }
          if (e.target.id == "vol") {
            CFG.vol = +e.target.value;
            if (MG) MG.gain.value = CFG.vol;
            saveCfg();
          }
        };
        $("set_btn").onclick = () => {
          setUI();
          $("settings_modal").style.display = "flex";
        };
        setUI();
        /* ==========================================================================
         * 54. CHARACTER PANEL & BUTTON ICONS
         * SVG icon helper and the character/run button icons.
         * ========================================================================== */
        const px_ = (w, r) =>
          `<svg width="17" height="17" viewBox="0 0 12 12" shape-rendering="crispEdges" style="display:block">${r.map((a) => `<rect x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}" fill="${a[4]}"/>`).join("")}</svg>`;
        const CHIC = px_(0, [
          [3, 0, 6, 1, "#2b1b10"],
          [3, 1, 6, 3, "#f5d0a9"],
          [4, 2, 1, 1, "#222"],
          [7, 2, 1, 1, "#222"],
          [2, 4, 8, 4, "#3a7bd5"],
          [2, 4, 8, 1, "#5a98ee"],
          [1, 5, 1, 3, "#f5d0a9"],
          [10, 5, 1, 3, "#f5d0a9"],
          [3, 8, 2, 3, "#3b3f63"],
          [7, 8, 2, 3, "#3b3f63"],
          [2, 11, 3, 1, "#4a3220"],
          [7, 11, 3, 1, "#4a3220"],
        ]);
        const runIc = (on) => {
          const c = on ? "#c0452f" : "#8a8f96",
            h = on ? "#e8715a" : "#b8bec6";
          return px_(
            0,
            [
              [4, 2, 4, 1, "#fff4dc"],
              [4, 3, 4, 5, c],
              [4, 3, 1, 5, h],
              [4, 7, 7, 2, c],
              [5, 4, 2, 1, "#ffd54f"],
              [5, 6, 2, 1, "#ffd54f"],
              [3, 9, 8, 2, "#2b1d14"],
            ].concat(
              on
                ? [
                    [0, 4, 3, 1, "#ffd54f"],
                    [0, 6, 2, 1, "#ffd54f"],
                    [1, 8, 2, 1, "#ffd54f"],
                  ]
                : [],
            ),
          );
        };
        $("ch_btn").innerHTML = CHIC;
        function charUI() {
          const A = P.act && { tree: "axe", rock: "pick", fish: "rod", attack: P.w }[P.act.k];
          $("chbody").innerHTML =
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">' +
            ["axe", "pick", "rod", P.w]
              .map(
                (k) =>
                  `<div class="k" style="display:block;text-align:center;${A == k ? "outline:2px solid #ffd54f" : ""}"><div>${gic(k, gear[k]).replace('class="ic"', 'class="ic" style="width:36px;height:36px"')}</div>${GN[k]}<br><b>${gear[k] >= 0 ? (k == "leather" ? "Leather" : TN[gear[k]]) : "None"}</b><br><small>${SKF[k]} ${lv(SKF[k])}</small></div>`,
              )
              .join("") +
            '</div><div class="k" style="margin-top:6px"><span>Defence bonus</span><b>' +
            DEF() +
            '</b></div><div class="k"><span>Combat level</span><b>' +
            cmb() +
            "</b></div>";
        }
        $("ch_btn").onclick = () => {
          charUI();
          $("char_modal").style.display = "flex";
        };
        $("cls_ch").onclick = () => ($("char_modal").style.display = "none");
        $("run_btn").onclick = () => {
          CFG.run ^= 1;
          saveCfg();
          msg("You are now " + (CFG.run ? "running" : "walking") + ".");
        };
        setInterval(() => {
          const b = $("run_btn");
          if (b._o !== CFG.run) {
            b._o = CFG.run;
            b.innerHTML = runIc(CFG.run);
          }
          b.style.background = CFG.run ? "#9a7a4e" : "var(--panel)";
          b.title = "Run: " + (CFG.run ? "ON" : "OFF") + " (" + Math.round(P.en) + "% energy)";
          if ($("char_modal").style.display == "flex") charUI();
        }, 300);
        setInterval(() => {
          $("mw").style.top = Math.round((76 * cv.getBoundingClientRect().width) / LW + 8) + "px";
        }, 400);
        fitCanvas();
        /* ==========================================================================
         * 55. BOOT
         * Initial canvas fit, first UI build and the very first frame.
         * ========================================================================== */
        addEventListener("resize", fitCanvas);
        if (window.visualViewport) visualViewport.addEventListener("resize", fitCanvas);
        ui();
        draw();
      };
    </script>
  </body>
</html>
